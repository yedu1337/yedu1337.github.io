name: Sync projects

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: project-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Discover and review
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync project data
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run sync

      - name: Render profile README
        run: npm run profile

      - name: Validate generated data
        run: |
          npm run check
          npm test
          npm run profile:check
          npm run build

      - name: Open or update review PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          branch: automation/project-sync
          delete-branch: true
          commit-message: 'chore: sync portfolio projects'
          title: 'chore: sync portfolio projects'
          body-path: src/data/sync-report.md
          labels: automation
          add-paths: |
            src/data/projects.json
            src/data/sync-report.json
            src/data/sync-report.md
            profile-readme/README.md
