name: Sync profile README

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile-readme/README.md'
      - 'src/data/projects.json'
      - 'site.config.json'

permissions:
  contents: read

jobs:
  publish:
    name: Publish profile README
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for profile deploy key
        id: profile
        env:
          PROFILE_DEPLOY_KEY: ${{ secrets.PROFILE_DEPLOY_KEY }}
        run: |
          if [ -n "$PROFILE_DEPLOY_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PROFILE_DEPLOY_KEY is not configured; skipping profile README sync."
          fi

      - name: Checkout profile repository
        if: steps.profile.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ vars.PROFILE_REPO || github.repository_owner }}
          ssh-key: ${{ secrets.PROFILE_DEPLOY_KEY }}
          path: profile-repo

      - name: Publish README
        if: steps.profile.outputs.enabled == 'true'
        run: |
          cp profile-readme/README.md profile-repo/README.md
          cd profile-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "Profile README is already current."
            exit 0
          fi
          git add README.md
          git commit -m "chore: sync profile README"
          git push
